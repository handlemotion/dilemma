name: Release macOS

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump
        type: choice
        required: true
        default: routine
        options:
          - routine
          - major

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Calculate release version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: node scripts/release-version.mjs "$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Build macOS disk images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          builder_args=("--config.extraMetadata.version=$VERSION" "--config.buildVersion=$VERSION")
          if [[ -n "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID" ]]; then
            : "${CSC_LINK:?Set the Developer ID certificate secret}"
            : "${APPLE_ID:?Set the Apple ID secret}"
            : "${APPLE_APP_SPECIFIC_PASSWORD:?Set the notarization password secret}"
            : "${APPLE_TEAM_ID:?Set the Apple Team ID secret}"
            builder_args+=(--config.forceCodeSigning=true --config.mac.notarize=true)
          else
            builder_args+=(--config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.notarize=false)
          fi
          pnpm --filter @dilemma/app run package:release "${builder_args[@]}"
      - name: Verify macOS packages
        working-directory: packages/app/release/distribution
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for app in mac*/Dilemma.app; do
            codesign --verify --deep --strict "$app"
            [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$VERSION" ]]
          done
          hdiutil verify "Dilemma-$VERSION-mac-arm64.dmg"
          hdiutil verify "Dilemma-$VERSION-mac-x64.dmg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          release_args=(--target "$GITHUB_SHA" --title "Dilemma v$VERSION" --generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "v$VERSION" "${release_args[@]}" \
            "packages/app/release/distribution/Dilemma-$VERSION-mac-arm64.dmg#Apple Silicon" \
            "packages/app/release/distribution/Dilemma-$VERSION-mac-x64.dmg#Intel"
